[project]
name = "jobpulse"
version = "0.1.0"
description = "JobPulse 大学生招聘信息聚合与投递管理 - 后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "openai>=1.10",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# 允许 from src.xxx import 直接运行
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
